<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaasan Eläinsuoja - Adoptoitavat eläimet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🐾 Vaasan Eläinsuoja ry</h1>
            <p class="text-emerald-100 hidden sm:block">Löydä uusi karvainen perheenjäsen</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Adoptoitavat eläimet</h2>
            <p class="text-slate-600">Tutustu alla oleviin eläimiin ja löydä sydämeesi sopiva kaveri.</p>
        </div>

        <!-- Eläinlista / Grid -->
        <div id="animal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JavaScript lataa kortit tähän -->
            <div class="col-span-full text-center py-12 text-slate-500">Ladataan eläimiä...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 py-6 mt-12 text-center text-sm">
        <p>&copy; Vaasan Eläinsuoja ry. Kaikki oikeudet pidätetään.</p>
    </footer>

    <!-- Frontend Script -->
    <script>
        async function fetchAnimals() {
            try {
                const response = await fetch('/api/animals');
                const animals = await response.json();

                const grid = document.getElementById('animal-grid');
                grid.innerHTML = '';

                if (animals.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">Ei tällä hetkellä adoptoitavia eläimiä.</div>';
                    return;
                }

                animals.forEach(animal => {
                    const isAdopted = animal.status === 'adopted';
                    const imageUrl = animal.image_url || 'https://images.unsplash.com/photo-1543466835-00a7907e9de1';

                    const card = document.createElement('div');
                    card.className = `bg-white rounded-xl shadow-md overflow-hidden flex flex-col transition hover:shadow-lg ${isAdopted ? 'opacity-75' : ''}`;

                    card.innerHTML = `
                        <div class="relative h-48 bg-slate-200">
                            <img src="${imageUrl}" alt="${animal.name}" class="w-full h-full object-cover">
                            ${isAdopted ? '<span class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded font-bold uppercase">Adoptoitu</span>' : '<span class="absolute top-2 right-2 bg-emerald-500 text-white text-xs px-2 py-1 rounded font-bold uppercase">Vapaana</span>'}
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <h3 class="text-xl font-bold text-slate-800 mb-1">${animal.name}</h3>
                            <p class="text-sm text-emerald-600 font-semibold mb-2">${animal.type} • ${animal.breed} • ${animal.age} v</p>
                            <p class="text-slate-600 text-sm mb-4 flex-grow line-clamp-2">${animal.description}</p>
                            <a href="animal.html?id=${animal.id}" class="block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition">
                                Katso lisää
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Virhe eläinten haussa:', err);
                document.getElementById('animal-grid').innerHTML = '<div class="col-span-full text-center py-12 text-red-500">Virhe eläintietojen lataamisessa.</div>';
            }
        }

        fetchAnimals();
    </script>
</body>

</html>
