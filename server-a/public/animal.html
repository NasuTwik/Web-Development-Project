<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eläimen tiedot - Vaasan Eläinsuoja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-emerald-100 hover:text-white font-medium flex items-center gap-2">
                &larr; Takaisin etusivulle
            </a>
            <h1 class="text-xl font-bold">Vaasan Eläinsuoja ry</h1>
            <div></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div id="loading" class="text-center py-12 text-slate-500">Ladataan tietoja...</div>

        <div id="animal-container"
            class="hidden bg-white rounded-2xl shadow-md overflow-hidden grid grid-cols-1 md:grid-cols-2 gap-8 p-6 md:p-8">
            <!-- Kuva -->
            <div class="relative h-72 md:h-full min-h-[300px] bg-slate-200 rounded-xl overflow-hidden">
                <img id="animal-img" src="" alt="" class="w-full h-full object-cover">
            </div>

            <!-- Tiedot & Lomake -->
            <div class="flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-2">
                        <h2 id="animal-name" class="text-3xl font-bold text-slate-800"></h2>
                        <span id="animal-status" class="px-3 py-1 rounded text-xs font-bold uppercase"></span>
                    </div>
                    <p id="animal-meta" class="text-emerald-600 font-semibold mb-4"></p>
                    <p id="animal-desc" class="text-slate-600 mb-6 leading-relaxed"></p>
                </div>

                <!-- Adoptiolomake -->
                <div id="adoption-section" class="border-t border-slate-100 pt-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Adoptoi tämä eläin</h3>
                    <form id="adoption-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nimi</label>
                            <input type="text" id="name" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Sähköposti</label>
                            <input type="email" id="email" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Puhelinnumero</label>
                            <input type="tel" id="phone"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Vapaamuotoinen viesti /
                                esittely</label>
                            <textarea id="message" rows="3"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                placeholder="Kerro hieman asumisolosuhteistasi..."></textarea>
                        </div>
                        <button type="submit" id="submit-btn"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-lg transition shadow-md">
                            Adoptoi minut
                        </button>
                    </form>
                </div>

                <div id="already-adopted-msg"
                    class="hidden bg-red-50 text-red-700 p-4 rounded-lg text-center font-medium mt-4">
                    Tämä eläin on jo adoptoitu!
                </div>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const animalId = urlParams.get('id');

        async function loadAnimal() {
            if (!animalId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`/api/animals/${animalId}`);
                if (!response.ok) throw new Error('Eläintä ei löytynyt');

                const animal = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('animal-container').classList.remove('hidden');

                document.getElementById('animal-img').src = animal.image_url || 'https://images.unsplash.com/photo-1543466835-00a7907e9de1';
                document.getElementById('animal-name').textContent = animal.name;
                document.getElementById('animal-meta').textContent = `${animal.type} • ${animal.breed} • ${animal.age} vuotta`;
                document.getElementById('animal-desc').textContent = animal.description;

                const statusEl = document.getElementById('animal-status');
                if (animal.status === 'adopted') {
                    statusEl.textContent = 'Adoptoitu';
                    statusEl.className = 'px-3 py-1 rounded text-xs font-bold uppercase bg-red-100 text-red-700';
                    document.getElementById('adoption-section').style.display = 'none';
                    document.getElementById('already-adopted-msg').classList.remove('hidden');
                } else {
                    statusEl.textContent = 'Vapaana';
                    statusEl.className = 'px-3 py-1 rounded text-xs font-bold uppercase bg-emerald-100 text-emerald-700';
                }

            } catch (err) {
                console.error(err);
                document.getElementById('loading').textContent = 'Eläintä ei löytynyt tai virhe tiedonhaussa.';
            }
        }

        document.getElementById('adoption-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Lähetetään...';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                message: document.getElementById('message').value
            };

            try {
                const res = await fetch(`/api/animals/${animalId}/adopt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = 'thankyou.html';
                } else {
                    alert('Virhe: ' + (data.error || 'Adoptio epäonnistui'));
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Adoptoi minut';
                }
            } catch (err) {
                console.error(err);
                alert('Yhteysvirhe palvelimeen.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Adoptoi minut';
            }
        });

        loadAnimal();
    </script>
</body>

</html>
